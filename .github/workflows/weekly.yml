name: 每周更新镜像

on:
  schedule:
    # 每周一 09:00 (Asia/Shanghai) = 周一 01:00 UTC
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-mirror
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 抓取并重新生成
        run: node build.mjs

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本周无新内容"
          else
            git commit -m "chore: 每周更新 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push
          fi
